name: Daily Tender Sync

on:
  schedule:
    # Taipei 06:10-16:10 every two hours, plus a final 17:50 sync
    - cron: '10 0,2,4,6,8,22 * * *'
    - cron: '50 9 * * *'
    # Taipei 20:30-04:30: backfill, history verification and matching
    - cron: '30 12,14,16,18,20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Update mode
        required: true
        default: live
        type: choice
        options:
          - live
          - maintenance

permissions:
  contents: write # Allows pushing the updated data.json back to the repo

concurrency:
  group: private-tender-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      RICOH_DATA_FILE: ${{ github.workspace }}/.private-state/data.json
      RICOH_SUBSCRIBERS_FILE: ${{ github.workspace }}/.private-state/subscribers.json
      RICOH_SENT_LOG_FILE: ${{ github.workspace }}/.private-state/sent_notifications.json
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout private crawler and notification state
        uses: actions/checkout@v4
        with:
          repository: gyuyu2002-Jeff/ricoh-intel-hub-private-state
          ref: main
          ssh-key: ${{ secrets.PRIVATE_STATE_SSH_KEY }}
          path: .private-state

      - name: Select Update Mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "UPDATE_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.event.schedule }}" == "30 12,14,16,18,20 * * *" ]]; then
            echo "UPDATE_MODE=maintenance" >> "$GITHUB_ENV"
          else
            echo "UPDATE_MODE=live" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate Crawler Rules
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: python -m unittest -v test_update_tenders.py test_public_data.py test_send_alerts.py

      - name: Run Crawler Script
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: python update_tenders.py --mode "$UPDATE_MODE"

      - name: Send Email Alerts
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SUBSCRIBERS_URL: ${{ secrets.SUBSCRIBERS_URL }}
          ADMIN_NOTIFY_EMAIL: ${{ secrets.ADMIN_NOTIFY_EMAIL }}
        run: python send_alerts.py

      - name: Persist private state
        if: always()
        working-directory: .private-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json sent_notifications.json subscribers.json
          git diff --cached --quiet || (git commit -m "Update private crawler and notification state" && git push)

      - name: Export public procurement facts
        run: python scripts/export_public_data.py --source "$RICOH_DATA_FILE" --output data.json --output client/public/data.json

      - name: Commit and push updated tender data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json client/public/data.json
          git diff --cached --quiet || (git commit -m "Auto-sync $UPDATE_MODE: $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
