name: Daily Tender Sync

on:
  schedule:
    # Taipei 06:10-16:10 every two hours, plus a final 17:50 sync
    - cron: '10 0,2,4,6,8,22 * * *'
    - cron: '50 9 * * *'
    # Taipei 20:30-04:30: backfill, history verification and matching
    - cron: '30 12,14,16,18,20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Update mode
        required: true
        default: live
        type: choice
        options:
          - live
          - maintenance

permissions:
  contents: write # Allows pushing the updated data.json back to the repo
  pages: write    # Allows uploading and deploying GitHub Pages
  id-token: write # Allows OIDC token for GitHub Pages

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Update Mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "UPDATE_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.event.schedule }}" == "30 12,14,16,18,20 * * *" ]]; then
            echo "UPDATE_MODE=maintenance" >> "$GITHUB_ENV"
          else
            echo "UPDATE_MODE=live" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate Crawler Rules
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: python -m unittest -v test_update_tenders.py

      - name: Run Crawler Script
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: python update_tenders.py --mode "$UPDATE_MODE"

      - name: Send Email Alerts
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME || 'huxen.ricoh@gmail.com' }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SUBSCRIBERS_URL: ${{ secrets.SUBSCRIBERS_URL }}
          ADMIN_NOTIFY_EMAIL: ${{ secrets.ADMIN_NOTIFY_EMAIL || 'gyuyu2002@gmail.com' }}
        run: python send_alerts.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Sync live tender data into public assets
        run: cp data.json client/public/data.json

      - name: Build website
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Sync build output to repository root
        run: |
          cp -r dist/* .
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json client/public/data.json sent_notifications.json subscribers.json index.html assets/
          git diff --cached --quiet && git commit --allow-empty -m "Auto-sync $UPDATE_MODE: $(date -u +'%Y-%m-%d %H:%M UTC')" || git commit -m "Auto-sync $UPDATE_MODE: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
