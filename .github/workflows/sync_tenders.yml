name: Daily Tender Sync

on:
  schedule:
    # Runs every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI / API

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows pushing the updated data.json back to the repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Crawler Script
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: python update_tenders.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && git commit --allow-empty -m "Auto-sync daily tenders: $(date -u +'%Y-%m-%d %H:%M UTC')" || git commit -m "Auto-sync daily tenders: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
