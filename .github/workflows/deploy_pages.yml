name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Daily Tender Sync]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Validate public data and regression tests
        run: |
          python -m unittest -v test_public_data.py test_update_tenders.py test_send_alerts.py
          python scripts/export_public_data.py --source data.json --check
          python scripts/export_public_data.py --source data.json --output client/public/data.json
          npm run check
          npx vitest run
      - name: Build website
        env:
          GITHUB_PAGES: "true"
        run: npm run build
      - name: Verify published dataset
        run: python scripts/export_public_data.py --source dist/data.json --check
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
